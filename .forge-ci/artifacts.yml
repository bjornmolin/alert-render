#
# What a release produces. Shape taken from forge-ci's own
# examples/cargo-app/artifacts.yml rather than guessed at.
#
# CONTAINER-FIRST: the Containerfile IS the build environment. `cargo build`
# runs inside it, so a release does not depend on a runner having the right
# toolchain -- rust-toolchain.toml is honoured in the builder stage the same way
# it is locally.

sign:
  method: sigstore

artifacts:
  - name: alert-render
    project-type: cargo
    config:
      build-mode: container-first
    # NO analyzed-artifact LAYER, because container-first leaves nothing for it
    # to analyse. That layer is syft scanning a built binary downloaded from the
    # build stage -- and container-first has no build stage: the compile lives
    # in the Containerfile, and the binary exists only inside the image. Asking
    # for it failed the release with "No Rust binary found" (exit 66), which is
    # the same shape as the Android case forge-ci's docs/sbom.md documents.
    #
    # The two that remain are the two that mean something here: `build` is the
    # lockfile-derived CycloneDX from sbom-cargo.yml, and `analyzed-container`
    # is syft over the pushed image -- the artefact we actually ship. Keeping
    # analyzed-container is also what makes publish-container.yml scan and
    # attest the image at all; it runs only if a source artifact asks for it.
    sboms: build,analyzed-container

containers:
  - name: alert-render
    from: [alert-render]
    container-file: Containerfile
    # The whole workspace: the builder stage copies it, because the binary is
    # the composition root of eight crates and `COPY crates/app` alone would
    # not compile.
    context: .
    target: runtime
    # BOTH, and the dev cluster is why. Production OpenShift is amd64; the
    # development k3s runs in Lima on an arm64 Mac, where an amd64-only image
    # fails with `exec format error` -- which wallet-iac-k3s has already paid
    # for once with another image.
    platforms: linux/amd64,linux/arm64
