#
# Triggered by pushing a `release-request/vX.Y.Z` tag, from which the
# orchestrator derives the real `vX.Y.Z`. It builds the container, signs it with
# Sigstore, attaches SLSA provenance, scans it, and emits a CycloneDX SBOM from
# Cargo.lock.
#
# PINNED TO THE SAME v0.90.0 AS THE PULL-REQUEST GATE, and for the same reason:
# the only published runtime images are built from 5f5bb1ee, which is that
# tag's commit. forge-ci released v0.91.0 through v0.91.10 on 2026-10-22; no
# release line has runtime images yet. Move both pins together, in their own
# commit.
#   v0.90.0 = 5f5bb1ee7ad706d7bca89695e485898204ef730c
#
# THE SECRETS THIS NEEDS, set 2026-10-23. Only the maintainer can set them, and
# a release fails on whichever is missing rather than silently producing
# something unsigned. Their VALUES are still unproven: no run has got far enough
# to use one (see bead ar-1kx.14).
#   RELEASE_TOKEN            push and release creation
#   RELEASE_GPG_*            signs the release commit and tag
#   CODE_SCANNING_TOKEN      optional, not set; the container scan then stays in
#                            the run's own output instead of Code Scanning
name: release

on:
  push:
    tags:
      - "release-request/v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    uses: diggsweden/forge-ci/.github/workflows/release-orchestrator.yml@5f5bb1ee7ad706d7bca89695e485898204ef730c # v0.90.0
    permissions:
      contents: write
      packages: write
      # Sigstore keyless signing and SLSA provenance both need this.
      id-token: write
      actions: read
      security-events: write
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
      RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
      RELEASE_GPG_PUBLIC_KEY: ${{ secrets.RELEASE_GPG_PUBLIC_KEY }}
      CODE_SCANNING_TOKEN: ${{ secrets.CODE_SCANNING_TOKEN }}
    with:
      branch: main
      forge-ci-binary-ref: v0.90.0
      # ONLY AN ALLOWLISTED SIGNER MAY CUT A RELEASE. `.forge-ci/allowed_signers`
      # names the key; this makes its ABSENCE fail the release rather than
      # downgrade it to a warning, which is the half that a file alone does not
      # buy. The engine default is false and diggsweden's shared template sets
      # it true; this repository is in the second group.
      #
      # The verification itself is `git verify-tag` with
      # gpg.ssh.allowedSignersFile, run by forge-ci -- so the same command
      # verifies locally, and the key being a FIDO token changes nothing.
      release.requireallowlistedsigner: true
      artifacts-config: .forge-ci/artifacts.yml
      changelog-creator: git-cliff
      release-publisher: github-cli
      # THE v0.90.0 RUNTIME IMAGES WERE NEVER PUBLISHED, so the orchestrator's
      # own defaults -- `:v0.90.0`, still the default at v0.91.10 -- do not
      # resolve, and the first release died pulling one before it reached a
      # single release step (`manifest unknown`, bead ar-1kx.14). forge-ci's
      # docs/runtime-images.md says it outright: those tags are prospective.
      #
      # `:weekly` is the same CODE: all three images carry
      # org.opencontainers.image.revision = 5f5bb1ee, the commit this workflow
      # pins. So this is a reachable tag for the pinned version, not a version
      # bump. Digests rather than `:weekly`, because weekly is a moving alias
      # that the next scheduled build replaces.
      #
      # REMOVE ALL THREE once forge-ci publishes release-tagged images, in the
      # same commit that moves the `@5f5bb1ee` pins.
      #
      # Three and no more, per forge-ci's workflow-to-image table: base plans,
      # summarises, writes the changelog and validates prerequisites; full
      # creates the release and aggregates the SBOM; rust-stable runs
      # sbom-cargo. publish-container builds on the host with Buildah and uses
      # no job container at all.
      runtime-image: ghcr.io/diggsweden/forge-ci-runtime-base@sha256:989c924513a83e95c0d487b4b6c6ee3599ce857333568c301d0d47e345e0b1ed # :weekly, rev 5f5bb1ee
      runtime-image-full: ghcr.io/diggsweden/forge-ci-runtime@sha256:dbabe0ae940a8de6b008a27b6b1abb00365c8483e8ef256ac82d2c650d38d150 # :weekly, rev 5f5bb1ee
      runtime-image-rust: ghcr.io/diggsweden/forge-ci-runtime-rust-stable@sha256:7860c47400fe752e49de5d3cd85ff267f1c2123038d4f13b68c1861613b9cb39 # :weekly, rev 5f5bb1ee
