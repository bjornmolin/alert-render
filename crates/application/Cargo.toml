[package]
name = "application"
version.workspace = true
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
domain = { path = "../domain" }
# Error plumbing and trait-object async only. No runtime and no serde:
# serialisation is an adapter concern, not a use-case concern.
thiserror = "2"
async-trait = "0.1"

# Dev-only. The architecture test reads normal dependencies, not dev ones, so a
# runtime for async tests here does not widen the layer -- `tokio` must never
# appear above this line.
[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
