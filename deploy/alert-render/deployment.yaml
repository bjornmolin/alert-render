apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-render
  labels:
    app.kubernetes.io/name: alert-render
spec:
  # TWO REPLICAS, AND THIS IS THE OPPOSITE OF webhook-proxy's RULE. That service
  # gates replicas > 1 on naming a database, because its deliveries live in an
  # outbox and two replicas without one each hold their own. This service holds
  # NOTHING: Alertmanager owns the retry, its notification log is on a
  # persistent volume, and a failure here is answered with a non-2xx and tried
  # again. So more than one replica is correct, and `crates/app/tests/
  # manifests.rs` asserts it -- because the obvious "fix" by analogy with the
  # sibling repository would be to set it to 1.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: alert-render
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alert-render
    spec:
      serviceAccountName: alert-render
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # FOUND BY RUNNING IT, 2026-10-22, in the dev cluster. Without fsGroup
        # the kubelet writes the mounted Secret as root:root, and the image runs
        # as 65532:65532 -- so `defaultMode: 0o440` is group-readable by a group
        # the process is not in, and every delivery failed.
        #
        # The symptom was exactly what the error taxonomy promised and nothing
        # more: a 500 from the listener, and
        # `alert_render_delivery_total{outcome="unaddressable"}` on the replica
        # that handled it -- a CONFIGURATION fault, not a network one, which is
        # what pointed at the mount instead of at the network. It cost one
        # metric scrape to diagnose rather than an afternoon, which is the whole
        # argument for keeping `unaddressable` apart from `unreachable`.
        #
        # 65532 is the uid AND gid the Containerfile sets; crates/app/tests/
        # manifests.rs asserts the two still agree.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alert-render
          # REPLACE: the image does not exist yet (bead ar-1kx.11). There is no
          # Containerfile and no release workflow, so this names nothing today.
          # Pin by digest when it does, not by tag: wallet-iac-k3s has already
          # paid for a `:main` that was never published.
          image: REPLACE-ME@sha256:REPLACE-ME
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: inbound
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          env:
            - name: ALERT_RENDER_LISTEN
              value: "0.0.0.0:8080"
            - name: ALERT_RENDER_METRICS_LISTEN
              value: "0.0.0.0:9090"
            - name: ALERT_RENDER_BINDINGS
              value: /etc/alert-render/bindings/bindings.yaml
            - name: ALERT_RENDER_TEMPLATES
              value: /etc/alert-render/templates
            - name: ALERT_RENDER_ROOMS
              value: /var/run/alert-render/rooms
            # Both left at their defaults deliberately, and set explicitly so a
            # reader sees what they are rather than reading the source: Unicode
            # sanitising ON, and the STRICT hookshot acceptance predicate. A
            # deployment pointing at a webhook inspector rather than a real
            # room is the only reason to change the second one.
            - name: ALERT_RENDER_SANITISE
              value: "true"
            - name: ALERT_RENDER_ACCEPTANCE
              value: hookshot-ok
          # FROM THE PROCESS ALONE, both probes. A probe that depended on the
          # room being reachable would take a healthy renderer out of service
          # every time the chat server hiccupped -- and restarting would not fix
          # something that is down elsewhere. There is no database and no queue
          # here, so there is nothing else for readiness to reflect.
          livenessProbe:
            httpGet:
              path: /health
              port: inbound
          readinessProbe:
            httpGet:
              path: /health
              port: inbound
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: bindings
              mountPath: /etc/alert-render/bindings
              readOnly: true
            - name: templates
              mountPath: /etc/alert-render/templates
              readOnly: true
            - name: rooms
              mountPath: /var/run/alert-render/rooms
              readOnly: true
      volumes:
        # Generated by kustomize, so the name carries a hash of the contents and
        # a change rolls the pods. Both are read ONCE at startup, so a change
        # that did not roll them would simply not take effect.
        - name: bindings
          configMap:
            name: alert-render-bindings
        - name: templates
          configMap:
            name: alert-render-templates
        # A SECRET, NEVER A ConfigMap. A room address is the whole credential.
        # Kubernetes backs a Secret volume with tmpfs already, so an explicit
        # memory-backed emptyDir is only needed when an agent renders INTO it --
        # which is the production shape, and identical to this one through the
        # port that reads it.
        - name: rooms
          secret:
            secretName: alert-render-rooms
            defaultMode: 0o440
