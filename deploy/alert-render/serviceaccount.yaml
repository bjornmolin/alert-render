apiVersion: v1
kind: ServiceAccount
metadata:
  name: alert-render
# NO TOKEN MOUNTED. This process never talks to the Kubernetes API -- it reads
# two mounted directories and answers HTTP. A projected ServiceAccount token
# would be a credential sitting in the pod that holds every room address, with
# nothing to use it for. The default is to mount one, so leaving this unsaid
# would quietly do it.
automountServiceAccountToken: false
